<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoopLife Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: the 9:16 intro centred on a dark page with simple play controls under it. */
  :root { --bg: #0b0b0c; --line: #2a2b31; --fg: #f3f1ec; --muted: #9c9ea6; --red: #d7262e; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .wrap { display: grid; justify-items: center; gap: 12px; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .label { font: 700 11px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: center; }
  h1 { margin: 0; font-size: clamp(22px, 3.6vw, 32px); font-weight: 700; letter-spacing: -.02em; text-align: center; }
  .frame { position: relative; height: min(80vh, 840px); aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: #0b0b0c; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
  #holder { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  .stage { position: absolute; inset: 0; overflow: hidden; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(460px, 100%); }
  .bar button { font: 700 13px Inter, sans-serif; color: var(--fg); background: #17181c; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .bar button[aria-pressed="true"] { border-color: var(--red); }
  .bar button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .bar input { flex: 1; min-width: 0; accent-color: var(--red); }
  .bar .t { font: 700 12px "JetBrains Mono", monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stageRoot { --sans: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
/*CSS*/
</style>
</head>
<body>
<div class="wrap">
  <div class="label">HoopLife · Intro &amp; outro · For Lawrance's approval</div>
  <h1>Ninja eyes → B1 ball → HOOPLIFE</h1>
  <div class="frame" id="frame"><div id="holder"><div id="stageRoot"></div></div></div>
  <div class="bar"><button type="button" id="play">Pause</button><input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Scrub"><span class="t" id="tm">0.0</span><button type="button" id="snd" aria-pressed="false">Sound off</button></div>
  <div class="label">Vertical 1080 × 1920 · for Reels, Shorts and WhatsApp Status</div>
</div>
<script>
(function () {
  "use strict";
  var SCENES = /*SCENES*/;
  var root = document.getElementById("stageRoot"); root.id = "stage";      // the scenes' CSS targets #stage
  root.style.cssText = "position:absolute;inset:0";
  // ---------- a small runtime with the same helpers the film's scenes use ----------
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  var base = {
    seg: function (t, a, b) { return clamp01((t - a) / (b - a)); },
    lerp: function (a, b, x) { return a + (b - a) * x; },
    clamp01: clamp01,
    eo: function (x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); },
    ei: function (x) { x = clamp01(x); return x * x * x; },
    eio: function (x) { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    h: function (html) { var d = document.createElement("div"); d.innerHTML = html.trim(); if (d.children.length === 1) return d.firstElementChild; var f = document.createElement("div"); f.style.display = "contents"; while (d.firstChild) f.appendChild(d.firstChild); return f; },
    W: 1080, H: 1920
  };
  var registry = {}, kit = Object.assign({}, base, { scene: function (id, def) { registry[id] = def; } });
  window.kit = kit;
/*SHARED*/
/*SCENEJS*/
  // build each scene in its own stage
  var start = 0, cut = SCENES.scenes.map(function (s) {
    var el = document.createElement("div"); el.className = "stage"; el.hidden = true; root.appendChild(el);
    var k = Object.assign({}, base, { stage: el, dur: s.dur, start: start }), def = registry[s.id], inst = Object.create(def);
    if (def.init) def.init.call(inst, k);
    var c = { id: s.id, a: start, b: start + s.dur, el: el, inst: inst, k: k }; start += s.dur; return c;
  });
  var END = start;
  // ---------- score: the film's original score, synthesised live (off until tapped) ----------
  var AC = null, events = [], sndOn = false, T0 = {};
  cut.forEach(function (c) { T0[c.id] = c.a; }); T0.END = END;
  var S = {
    tempo: function () {}, master: function () {}, program: function () {},
    note: function (tr, n, o) { events.push({ t: o.t, kind: "note", tr: tr, notes: [n], dur: o.dur, vel: o.vel }); },
    chord: function (tr, ns, o) { events.push({ t: o.t, kind: "note", tr: tr, notes: ns, dur: o.dur, vel: o.vel }); },
    drum: function (name, o) { events.push({ t: o.t, kind: "drum", name: name, vel: o.vel }); },
    fx: function (name, t, o) { events.push({ t: t, kind: "fx", name: name, dur: (o && o.dur) || 0.4, vel: (o && o.vel) || 50, into: o && o.into }); }
  };
  kit.score = function (fn) { fn(S, T0); };
/*SCORE*/
  events.sort(function (a, b) { return a.t - b.t; });
  function hz(n) { var m = /([A-G])(#?)(\d)/.exec(n), map = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }; return 440 * Math.pow(2, (map[m[1]] + (m[2] ? 1 : 0) + (parseInt(m[3], 10) + 1) * 12 - 69) / 12); }
  function play(ev) {
    var t = AC.currentTime, v = (ev.vel || 60) / 127;
    function osc(type, f, dur, vol, f2) { var o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05); }
    function noise(dur, vol, hp, sweep) { var n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (var i = 0; i < n; i++) { var e = sweep ? i / n : 1 - i / n; d[i] = (Math.random() * 2 - 1) * e; } var s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp; s.buffer = b; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); }
    if (ev.kind === "note") ev.notes.forEach(function (n) { osc(ev.tr === "bass" ? "triangle" : ev.tr === "keys" ? "sine" : "sawtooth", hz(n), Math.min(ev.dur || 1, 3.5), (ev.tr === "pad" ? 0.05 : 0.12) * v); });
    else if (ev.kind === "drum") { osc("sine", 120, 0.35, 0.7 * v, 40); }
    else if (ev.name === "whoosh" || ev.name === "revswell") noise(ev.dur, 0.25 * v, 900, ev.into || ev.name === "revswell");
    else if (ev.name === "tick" || ev.name === "click") osc("square", 1800, 0.04, 0.08 * v);
    else if (ev.name === "chime") { osc("sine", 1318, 1.2, 0.12 * v); osc("sine", 1975, 1.0, 0.06 * v); }
  }
  // ---------- transport ----------
  var holder = document.getElementById("holder"), frame = document.getElementById("frame");
  function fit() { var s = frame.clientWidth / 1080; holder.style.transform = "scale(" + s + ")"; }
  window.addEventListener("resize", fit); fit();
  var T = 0, playing = true, last = performance.now(), prev = 0;
  var hq = /t=([\d.]+)/.exec(location.hash); if (hq) { T = parseFloat(hq[1]); playing = false; }
  var playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), tm = document.getElementById("tm"), snd = document.getElementById("snd");
  scrub.max = END; playBtn.textContent = playing ? "Pause" : "Play";
  playBtn.addEventListener("click", function () { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; if (playing && T >= END) T = 0; });
  scrub.addEventListener("input", function () { T = +scrub.value; prev = T; });
  snd.addEventListener("click", function () { sndOn = !sndOn; if (sndOn && !AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { sndOn = false; } } if (AC && AC.state === "suspended") AC.resume(); snd.setAttribute("aria-pressed", String(sndOn)); snd.textContent = sndOn ? "Sound on" : "Sound off"; });
  function frameFn(now) {
    requestAnimationFrame(frameFn);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { prev = T; T += dt; if (T >= END) { T = 0; prev = 0; } if (sndOn && AC) events.forEach(function (ev) { if (ev.t >= prev && ev.t < T) play(ev); }); }
    var t = Math.min(T, END - 0.0001);
    cut.forEach(function (c) { var on = t >= c.a && t < c.b; c.el.hidden = !on; if (on) c.inst.render.call(c.inst, t - c.a, c.k); });
    scrub.value = T; tm.textContent = T.toFixed(1);
  }
  requestAnimationFrame(frameFn);
})();
</script>
</body>
</html>
