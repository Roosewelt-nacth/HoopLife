<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="HoopLife Community, masked ninja logo">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <clipPath id="a-ball"><circle cx="200" cy="165" r="110"/></clipPath>
  </defs>
  <!-- headband tails (behind ball) -->
  <path d="M296,124 C326,112 350,92 378,96 L370,110 C348,108 330,126 304,138 Z" fill="#D7262E"/>
  <path d="M298,136 C332,142 348,162 372,176 L358,184 C338,170 322,154 300,148 Z" fill="#A81C23"/>
  <!-- ball -->
  <circle cx="200" cy="165" r="110" fill="#C9A24A"/>
  <g clip-path="url(#a-ball)">
    <g fill="none" stroke="#0B0B0C" stroke-width="5" stroke-linecap="round">
      <line x1="200" y1="50" x2="200" y2="280"/>
      <line x1="85" y1="232" x2="315" y2="232"/>
      <path d="M112,96 C152,136 152,206 112,246"/>
      <path d="M288,96 C248,136 248,206 288,246"/>
    </g>
    <!-- headband -->
    <rect x="80" y="112" width="240" height="26" fill="#D7262E"/>
    <!-- mask -->
    <rect x="80" y="144" width="240" height="54" fill="#0B0B0C"/>
    <path d="M136,164 L190,174 L186,188 L144,183 Z" fill="#FFFFFF"/>
    <path d="M264,164 L210,174 L214,188 L256,183 Z" fill="#FFFFFF"/>
  </g>
  <!-- knot -->
  <circle cx="302" cy="132" r="9" fill="#A81C23"/>
  <!-- wordmark -->
  <text x="200" y="345" text-anchor="middle" font-family="Anton, Impact, 'Arial Black', sans-serif" font-size="60" letter-spacing="2" fill="#0B0B0C">HOOPLIFE</text>
  <text x="200" y="378" text-anchor="middle" font-family="Anton, Impact, 'Arial Black', sans-serif" font-size="17" letter-spacing="11" fill="#C9A24A">COMMUNITY</text>
</svg>
