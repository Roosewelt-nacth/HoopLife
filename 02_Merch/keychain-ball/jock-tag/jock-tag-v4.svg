<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="1800" height="840">
  <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .m { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <defs>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1A1A1D"/><circle cx="4" cy="4" r="1.3" fill="#0E0E10"/></pattern>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#111113"/><rect width="3" height="1" fill="#19191C"/><rect width="1" height="3" fill="#0C0C0E"/></pattern>
    <filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
    <!-- half court, drawn once and mirrored so both ends match -->
    <g id="half" fill="none" stroke-linecap="round">
      <rect x="0" y="34" width="36" height="36" stroke="#44444C" stroke-width="1.4"/>
      <path d="M36,40 A12,12 0 0 1 36,64" stroke="#44444C" stroke-width="1.4"/>
      <line x1="7" y1="44" x2="7" y2="60" stroke="#44444C" stroke-width="1.4"/>
      <circle cx="11" cy="52" r="2.8" stroke="#44444C" stroke-width="1.4"/>
      <path d="M0,10 H16 A42,42 0 0 1 16,94 H0" stroke="#C9A24A" stroke-width="2"/>
    </g>
    <!-- scoreboard segments -->
    <rect id="sh" width="22" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect id="sv" width="7" height="24" rx="3.5" fill="#FFFFFF"/>
    <rect id="oh" width="22" height="7" rx="3.5" fill="#1C1C20"/>
    <rect id="ov" width="7" height="24" rx="3.5" fill="#1C1C20"/>
  </defs>
  <rect width="900" height="420" fill="url(#mesh)"/>

  <!-- Jock tag 44 x 16.2 mm at 10 px/mm, shown x1.8.  Grid: 16 px margin, 10 px gutters, every block shares top 16 and bottom 146. -->
  <g transform="translate(54 64) scale(1.8)" filter="url(#lift)">
    <rect width="440" height="162" rx="7" fill="url(#weave)"/>
    <rect x="7" y="7" width="426" height="148" rx="4" fill="none" stroke="#4A4A52" stroke-width="1.4" stroke-dasharray="5 4"/>

    <!-- 1. mark slot: 16 to 146 -->
    <rect x="16" y="16" width="44" height="130" rx="4" fill="#D7262E"/>
    <g transform="translate(38 81) scale(0.19) translate(-100 -100)" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="100" r="84"/>
      <path d="M42,42 C64,76 64,124 42,158 M158,42 C136,76 136,124 158,158 M16,100 H58 M142,100 H184 M100,16 V60 M100,140 V184"/>
      <polyline points="58,100 81,100 90,72 100,128 110,100 142,100" stroke="#111113"/>
    </g>

    <!-- 2. court 16 to 120, slogan strip 128 to 146 -->
    <g transform="translate(70 16)">
      <rect width="212" height="104" rx="2" fill="#16161A" stroke="#FFFFFF" stroke-width="1.8"/>
      <use href="#half"/>
      <use href="#half" transform="translate(212 0) scale(-1 1)"/>
      <circle cx="106" cy="52" r="13" fill="none" stroke="#44444C" stroke-width="1.4"/>
      <polyline points="106,4 106,40 100,44 112,55 106,60 106,100" fill="none" stroke="#D7262E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="70" y="128" width="212" height="18" rx="2" fill="#FFFFFF"/>
    <text class="m" x="176" y="140.6" text-anchor="middle" font-size="8.4" font-weight="700" textLength="186" lengthAdjust="spacingAndGlyphs" fill="#111113">ONE COURT · ONE FAMILY</text>

    <!-- 3. right column 292 to 404: wordmark 16 to 34.5, scoreboard 44 to 146 -->
    <g transform="translate(292 16) scale(0.1848)" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,0 V100 M52,0 V100 M0,50 H52"/>
      <path transform="translate(80,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(192,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(304,0)" d="M0,100 V0 H26 A26,26 0 0 1 26,52 H0"/>
      <path transform="translate(384,0)" d="M0,0 V100 H46"/>
      <path transform="translate(458,0)" d="M0,0 V100"/>
      <path transform="translate(486,0)" d="M46,0 H0 V100 M0,50 H38"/>
      <path transform="translate(560,0)" d="M46,0 H0 V100 H46 M0,50 H38"/>
    </g>
    <rect x="292" y="44" width="112" height="102" rx="3" fill="#0B0B0C" stroke="#2E2E34" stroke-width="1.2"/>
    <text class="m" x="348" y="58" text-anchor="middle" font-size="7" font-weight="700" letter-spacing="2" fill="#8E8E96">NO.</text>
    <!-- two digits, unlit segments shown faintly like a real scoreboard. Each digit 36 x 62; centred in the box. -->
    <g transform="translate(310 66)">
      <g><!-- 0 -->
        <use href="#sh" x="7" y="0"/><use href="#sv" x="0" y="5"/><use href="#sv" x="29" y="5"/>
        <use href="#oh" x="7" y="27.5"/>
        <use href="#sv" x="0" y="33"/><use href="#sv" x="29" y="33"/><use href="#sh" x="7" y="55"/>
      </g>
      <g transform="translate(40 0)"><!-- 1 -->
        <use href="#oh" x="7" y="0"/><use href="#ov" x="0" y="5"/><use href="#sv" x="29" y="5"/>
        <use href="#oh" x="7" y="27.5"/>
        <use href="#ov" x="0" y="33"/><use href="#sv" x="29" y="33"/><use href="#oh" x="7" y="55"/>
      </g>
    </g>
    <circle cx="396" cy="138" r="2.2" fill="#D7262E"/>

    <!-- 4. side strip -->
    <line x1="414" y1="16" x2="414" y2="146" stroke="#2A2A2F" stroke-width="1"/>
    <text class="m" transform="translate(425 81) rotate(-90)" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#FFFFFF">EST. 2026</text>
  </g>

  <text class="m" x="450" y="400" text-anchor="middle" font-size="12" letter-spacing="2" fill="#6B6B72">JOCK TAG v4 · 44 × 16 MM WOVEN · ONE-SIDED · DESIGN FOR APPROVAL</text>
</svg>
