<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="1800" height="920">
  <style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .d { font-family: Archivo, 'Arial Black', sans-serif; }
    .m { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <defs>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1A1A1D"/><circle cx="4" cy="4" r="1.3" fill="#0E0E10"/></pattern>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#111113"/><rect width="3" height="1" fill="#19191C"/><rect width="1" height="3" fill="#0C0C0E"/></pattern>
    <filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
    <!-- half court, drawn once and mirrored so both ends match -->
    <g id="half" fill="none" stroke-linecap="round">
      <rect x="0" y="34" width="36" height="36" stroke="#44444C" stroke-width="1.4"/>
      <path d="M36,40 A12,12 0 0 1 36,64" stroke="#44444C" stroke-width="1.4"/>
      <line x1="7" y1="44" x2="7" y2="60" stroke="#44444C" stroke-width="1.4"/>
      <circle cx="11" cy="52" r="2.8" stroke="#44444C" stroke-width="1.4"/>
      <path d="M0,10 H16 A42,42 0 0 1 16,94 H0" stroke="#C9A24A" stroke-width="2"/>
    </g>
    <!-- shot-clock segments -->
    <g id="seg-h"><rect width="16" height="5" rx="2.5" fill="#FFFFFF"/></g>
    <g id="seg-v"><rect width="5" height="16" rx="2.5" fill="#FFFFFF"/></g>
  </defs>
  <rect width="900" height="460" fill="url(#mesh)"/>

  <!-- Compact jock tag: 44 x 18 mm at 10 px/mm, shown x1.8 -->
  <g transform="translate(54 68) scale(1.8)" filter="url(#lift)">
    <rect width="440" height="180" rx="7" fill="url(#weave)"/>
    <rect x="7" y="7" width="426" height="166" rx="4" fill="none" stroke="#4A4A52" stroke-width="1.4" stroke-dasharray="5 4"/>

    <!-- A. mark slot -->
    <rect x="16" y="16" width="44" height="148" rx="4" fill="#D7262E"/>
    <g transform="translate(38 90) scale(0.19) translate(-100 -100)" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="100" r="84"/>
      <path d="M42,42 C64,76 64,124 42,158 M158,42 C136,76 136,124 158,158 M16,100 H58 M142,100 H184 M100,16 V60 M100,140 V184"/>
      <polyline points="58,100 81,100 90,72 100,128 110,100 142,100" stroke="#111113"/>
    </g>

    <!-- B. the court: symmetric ends, heartbeat as the half-court line -->
    <g transform="translate(70 16)">
      <rect width="212" height="104" rx="2" fill="#16161A" stroke="#FFFFFF" stroke-width="1.8"/>
      <use href="#half"/>
      <use href="#half" transform="translate(212 0) scale(-1 1)"/>
      <circle cx="106" cy="52" r="13" fill="none" stroke="#44444C" stroke-width="1.4"/>
      <polyline points="106,4 106,40 100,44 112,55 106,60 106,100" fill="none" stroke="#D7262E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- slogan strip + serial under the court -->
    <rect x="70" y="128" width="212" height="18" rx="2" fill="#FFFFFF"/>
    <text class="m" x="176" y="140.5" text-anchor="middle" font-size="8.4" font-weight="700" textLength="190" lengthAdjust="spacingAndGlyphs" fill="#111113">ONE COURT · ONE FAMILY</text>
    <text class="m" x="70" y="160" font-size="7" font-weight="500" letter-spacing="1.6" fill="#8E8E96">HL·26·0001</text>
    <text class="m" x="282" y="160" text-anchor="end" font-size="7" font-weight="500" letter-spacing="1.6" fill="#8E8E96">AUTHENTIC</text>

    <!-- C. right block: wordmark, shot-clock number, level -->
    <g transform="translate(294 20) scale(0.172)" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,0 V100 M52,0 V100 M0,50 H52"/>
      <path transform="translate(80,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(192,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(304,0)" d="M0,100 V0 H26 A26,26 0 0 1 26,52 H0"/>
      <path transform="translate(384,0)" d="M0,0 V100 H46"/>
      <path transform="translate(458,0)" d="M0,0 V100"/>
      <path transform="translate(486,0)" d="M46,0 H0 V100 M0,50 H38"/>
      <path transform="translate(560,0)" d="M46,0 H0 V100 H46 M0,50 H38"/>
    </g>
    <!-- shot-clock box -->
    <rect x="294" y="48" width="62" height="72" rx="3" fill="#0B0B0C" stroke="#2E2E34" stroke-width="1.2"/>
    <text class="m" x="325" y="59" text-anchor="middle" font-size="6.5" font-weight="700" letter-spacing="1.6" fill="#8E8E96">NO.</text>
    <g transform="translate(303 64)">
      <!-- 0 -->
      <use href="#seg-h" x="2" y="0"/><use href="#seg-v" x="0" y="3"/><use href="#seg-v" x="15" y="3"/>
      <use href="#seg-v" x="0" y="23"/><use href="#seg-v" x="15" y="23"/><use href="#seg-h" x="2" y="38"/>
      <!-- 1 -->
      <use href="#seg-v" x="37" y="3"/><use href="#seg-v" x="37" y="23"/>
    </g>
    <circle cx="349" cy="112" r="2" fill="#D7262E"/>
    <!-- level box, like a jersey size -->
    <rect x="362" y="48" width="42" height="72" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <text class="m" x="383" y="62" text-anchor="middle" font-size="6.5" font-weight="700" letter-spacing="1.4" fill="#8E8E96">LEVEL</text>
    <text class="d" x="383" y="98" text-anchor="middle" font-size="22" font-weight="900" textLength="34" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">ALL</text>
    <line x1="370" y1="108" x2="396" y2="108" stroke="#C9A24A" stroke-width="1.6"/>
    <!-- bio line -->
    <text class="m" x="349" y="140.5" text-anchor="middle" font-size="7.2" font-weight="700" textLength="110" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">PASSION · PURPOSE · HOOPS</text>
    <text class="m" x="349" y="160" text-anchor="middle" font-size="7" font-weight="500" letter-spacing="1.6" fill="#8E8E96">MEMBER ISSUE</text>

    <!-- D. side strip -->
    <line x1="414" y1="20" x2="414" y2="160" stroke="#2A2A2F" stroke-width="1"/>
    <text class="m" transform="translate(424 90) rotate(-90)" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#FFFFFF">EST. 2026</text>
  </g>

  <text class="m" x="450" y="440" text-anchor="middle" font-size="12" letter-spacing="2" fill="#6B6B72">COMPACT JOCK TAG v3 · 44 × 18 MM WOVEN · ONE-SIDED · DESIGN FOR APPROVAL</text>
</svg>
