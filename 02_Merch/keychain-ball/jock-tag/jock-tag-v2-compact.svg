<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="1800" height="920">
  <style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .d { font-family: Archivo, 'Arial Black', sans-serif; }
    .m { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <defs>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1A1A1D"/><circle cx="4" cy="4" r="1.3" fill="#0E0E10"/></pattern>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#111113"/><rect width="3" height="1" fill="#19191C"/><rect width="1" height="3" fill="#0C0C0E"/></pattern>
    <filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="900" height="460" fill="url(#mesh)"/>

  <!-- Compact one-sided jock tag: 44 x 18 mm at 10 px/mm, shown x1.8 -->
  <g transform="translate(54 68) scale(1.8)" filter="url(#lift)">
    <rect width="440" height="180" rx="7" fill="url(#weave)"/>
    <rect x="7" y="7" width="426" height="166" rx="4" fill="none" stroke="#4A4A52" stroke-width="1.4" stroke-dasharray="5 4"/>

    <!-- 1. mark slot -->
    <rect x="18" y="18" width="56" height="144" rx="4" fill="#D7262E"/>
    <g transform="translate(46 90) scale(0.22) translate(-100 -100)" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="100" r="84"/>
      <path d="M42,42 C64,76 64,124 42,158 M158,42 C136,76 136,124 158,158 M16,100 H58 M142,100 H184 M100,16 V60 M100,140 V184"/>
      <polyline points="58,100 81,100 90,72 100,128 110,100 142,100" stroke="#111113"/>
    </g>

    <!-- 2. member number -->
    <text class="m" x="113" y="66" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="2" fill="#8E8E96">NO.</text>
    <text class="d" x="113" y="116" text-anchor="middle" font-size="46" font-weight="900" textLength="52" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">01</text>

    <!-- 3. the court: half-court line is the heartbeat -->
    <g transform="translate(150 30)">
      <rect width="170" height="94" rx="2" fill="#16161A" stroke="#FFFFFF" stroke-width="1.8"/>
      <g fill="none" stroke="#3E3E46" stroke-width="1.4">
        <rect x="0" y="31" width="34" height="32"/><rect x="136" y="31" width="34" height="32"/>
        <path d="M34,35 A12,12 0 0 1 34,59 M136,35 A12,12 0 0 0 136,59"/>
        <circle cx="85" cy="47" r="12"/>
        <circle cx="8" cy="47" r="2.6"/><circle cx="162" cy="47" r="2.6"/>
        <path d="M0,10 H14 A40,40 0 0 1 14,84 H0"/>
      </g>
      <path d="M170,10 H156 A40,40 0 0 0 156,84 H170" fill="none" stroke="#C9A24A" stroke-width="2"/>
      <polyline points="85,4 85,38 80,41 91,51 85,56 85,90" fill="none" stroke="#D7262E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="102" width="170" height="20" rx="2" fill="#FFFFFF"/>
      <text class="m" x="85" y="116" text-anchor="middle" font-size="8.6" font-weight="700" textLength="150" lengthAdjust="spacingAndGlyphs" fill="#111113">ONE COURT · ONE FAMILY</text>
    </g>

    <!-- 4. wordmark -->
    <g transform="translate(336 84) scale(0.1) " fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,0 V100 M52,0 V100 M0,50 H52"/>
      <path transform="translate(80,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(192,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(304,0)" d="M0,100 V0 H26 A26,26 0 0 1 26,52 H0"/>
      <path transform="translate(384,0)" d="M0,0 V100 H46"/>
      <path transform="translate(458,0)" d="M0,0 V100"/>
      <path transform="translate(486,0)" d="M46,0 H0 V100 M0,50 H38"/>
      <path transform="translate(560,0)" d="M46,0 H0 V100 H46 M0,50 H38"/>
    </g>

    <!-- 5. side strip -->
    <line x1="412" y1="22" x2="412" y2="158" stroke="#2A2A2F" stroke-width="1"/>
    <text class="m" transform="translate(423 90) rotate(-90)" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#FFFFFF">EST. 2026</text>
  </g>

  <text class="m" x="450" y="440" text-anchor="middle" font-size="12" letter-spacing="2" fill="#6B6B72">COMPACT JOCK TAG · 44 × 18 MM WOVEN · ONE-SIDED · DESIGN FOR APPROVAL</text>
</svg>
