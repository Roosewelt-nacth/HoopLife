<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="1800" height="1040">
  <style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .d { font-family: Archivo, 'Arial Black', sans-serif; }
    .m { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <defs>
    <!-- jersey mesh fabric -->
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1A1A1D"/><circle cx="4" cy="4" r="1.3" fill="#0E0E10"/>
    </pattern>
    <!-- woven label threads -->
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#111113"/><rect width="3" height="1" fill="#19191C"/><rect width="1" height="3" fill="#0C0C0E"/>
    </pattern>
    <filter id="lift" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <!-- fabric backdrop -->
  <rect width="900" height="520" fill="url(#mesh)"/>

  <!-- embroidered slogan above the tag, as on a jersey -->
  <text class="d" x="450" y="112" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="3" fill="#C9A24A" filter="url(#lift)">PASSION. PURPOSE. HOOPS.</text>

  <!-- the jock tag: 50 x 22 mm at 10 px/mm, scaled x1.4 -->
  <g transform="translate(100 160) scale(1.4)" filter="url(#lift)">
    <rect width="500" height="220" rx="8" fill="url(#weave)"/>
    <rect x="8" y="8" width="484" height="204" rx="5" fill="none" stroke="#5A5A62" stroke-width="1.6" stroke-dasharray="6 5"/>

    <!-- 1. mark panel -->
    <rect x="22" y="22" width="78" height="176" rx="4" fill="#D7262E"/>
    <g transform="translate(61 110) scale(0.31) translate(-100 -100)" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="100" r="84"/>
      <path d="M42,42 C64,76 64,124 42,158 M158,42 C136,76 136,124 158,158 M16,100 H58 M142,100 H184 M100,16 V60 M100,140 V184"/>
      <polyline points="58,100 81,100 90,72 100,128 110,100 142,100" stroke="#111113"/>
    </g>
    <text class="m" x="61" y="188" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">HL</text>

    <!-- 2. number -->
    <text class="m" x="158" y="72" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#9A9AA1">NO.</text>
    <text class="d" x="158" y="140" text-anchor="middle" font-size="62" font-weight="900" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">01</text>

    <!-- 3. spec box -->
    <rect x="216" y="34" width="178" height="152" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text class="d" x="305" y="68" text-anchor="middle" font-size="15" font-weight="900" textLength="92" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">MADE FOR</text>
    <text class="d" x="305" y="88" text-anchor="middle" font-size="15" font-weight="900" textLength="138" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">THE BLACKTOP</text>
    <polyline points="238,110 282,110 292,98 304,122 314,110 372,110" fill="none" stroke="#D7262E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="m" x="305" y="142" text-anchor="middle" font-size="9" font-weight="700" textLength="150" lengthAdjust="spacingAndGlyphs" fill="#C9C9CE">OFFICIAL MEMBER ISSUE</text>
    <rect x="228" y="154" width="154" height="22" rx="2" fill="#FFFFFF"/>
    <text class="m" x="305" y="169.5" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="2" fill="#111113">HL·26·0001</text>

    <!-- 4. wordmark, in the brand's own letters -->
    <g transform="translate(410 98) scale(0.105)" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,0 V100 M52,0 V100 M0,50 H52"/>
      <path transform="translate(80,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(192,0)" d="M42,0 A42,50 0 1 0 42.01,0"/>
      <path transform="translate(304,0)" d="M0,100 V0 H26 A26,26 0 0 1 26,52 H0"/>
      <path transform="translate(384,0)" d="M0,0 V100 H46"/>
      <path transform="translate(458,0)" d="M0,0 V100"/>
      <path transform="translate(486,0)" d="M46,0 H0 V100 M0,50 H38"/>
      <path transform="translate(560,0)" d="M46,0 H0 V100 H46 M0,50 H38"/>
    </g>

    <!-- 5. side strip, read upward -->
    <line x1="480" y1="26" x2="480" y2="194" stroke="#2A2A2F" stroke-width="1"/>
    <text class="m" transform="translate(490 110) rotate(-90)" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">EST. 2026</text>
  </g>

  <text class="m" x="450" y="500" text-anchor="middle" font-size="12" letter-spacing="2" fill="#6B6B72">JOCK TAG · 50 × 22 MM WOVEN LABEL · DESIGN FOR APPROVAL</text>
</svg>
